name: Build VyOS ARM64 Rootfs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-vyos-arm64.yml'

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout vyos-build
        uses: actions/checkout@v4
        with:
          repository: vyos/vyos-build
          path: vyos-build

      - name: Docker-Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: VyOS-Build-Image bauen (nativ, kein --platform noetig)
        run: |
          cd vyos-build/docker
          docker build -t vyos-build:rolling-arm64 .

      - name: VyOS ARM64-Rootfs bauen
        run: |
          cd vyos-build
          docker run --rm --privileged \
            --network host \
            -v "$(pwd)":/vyos \
            -w /vyos \
            vyos-build:rolling-arm64 \
            sudo ./build-vyos-image --architecture arm64 generic

      - name: Ergebnis-Dateien auflisten (vollstaendig, rekursiv)
        run: |
          echo "=== Alle Dateien direkt in vyos-build/ ==="
          find vyos-build -maxdepth 1 -type f
          echo "=== Alle .iso/.img/.tar.gz/.raw im gesamten Repo ==="
          find vyos-build -type f \( -iname "*.iso" -o -iname "*.img" -o -iname "*.raw" -o -iname "*.tar.gz" -o -iname "live-image*" \) 2>/dev/null

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: vyos-arm64-rootfs
          path: |
            vyos-build/*.iso
            vyos-build/*.img
            vyos-build/*.raw
            vyos-build/*.tar.gz
            vyos-build/live-image*
          retention-days: 14
          if-no-files-found: warn
