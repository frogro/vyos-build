name: Build VyOS Rock5B Image (Rolling + Armbian)

on:
  workflow_dispatch:
    inputs:
      armbian_release_tag:
        description: 'Release tag in this repo where the Armbian .img.xz is stored'
        required: true
        default: 'armbian-rock5b-dwc3-fix'

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout own repo (scripts)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout vyos-build (current rolling)
        uses: actions/checkout@v4
        with:
          repository: vyos/vyos-build
          path: vyos-build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip 7zip-standalone squashfs-tools gdisk parted e2fsprogs xz-utils rsync util-linux gh

      - name: Download Armbian image from release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.armbian_release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.img.xz" \
            --pattern "SHA256SUMS" \
            --dir armbian

      - name: Verify Armbian release checksum
        run: |
          cd armbian
          sha256sum -c SHA256SUMS

      - name: Build VyOS build image (native, no --platform needed)
        run: |
          cd vyos-build/docker
          docker build -t vyos-build:rolling-arm64 .

      - name: Build VyOS ARM64 rootfs/ISO
        run: |
          cd vyos-build
          docker run --rm --privileged \
            --network host \
            -v "$(pwd)":/vyos \
            -w /vyos \
            vyos-build:rolling-arm64 \
            sudo ./build-vyos-image --architecture arm64 generic

      - name: Extract rootfs from ISO
        run: |
          ISO_FILE=$(find vyos-build/build -maxdepth 1 -iname "*.iso" | head -1)
          echo "ISO: $ISO_FILE"
          mkdir -p iso-extract
          7zz x "$ISO_FILE" -oiso-extract live/filesystem.squashfs -y
          mkdir -p vyos-rootfs-fresh
          sudo unsquashfs -f -d vyos-rootfs-fresh iso-extract/live/filesystem.squashfs
          cd vyos-rootfs-fresh
          sudo tar -czf ../vyos-rootfs-fresh.tar.gz .

      - name: Merge with Armbian kernel
        run: |
          chmod +x repo/scripts/rock5b/merge-vyos-rock5b.sh
          ARMBIAN_XZ=$(find armbian -iname "*.img.xz" | head -1)
          sudo ./repo/scripts/rock5b/merge-vyos-rock5b.sh \
            "$ARMBIAN_XZ" \
            vyos-rootfs-fresh.tar.gz \
            out-merged

      - name: Inject default config.boot, AP/locale scripts and armbianEnv.txt
        run: |
          chmod +x repo/scripts/rock5b/inject-defaults.sh
          WORKDIR=$(mktemp -d)
          sudo tar xzf out-merged/vyos-rootfs-rock5b-merged.tar.gz -C "$WORKDIR"
          sudo ./repo/scripts/rock5b/inject-defaults.sh "$WORKDIR" repo/scripts/rock5b/first-boot
          chmod +x repo/scripts/rock5b/install-network-firmware.sh
          sudo ./repo/scripts/rock5b/install-network-firmware.sh "$WORKDIR"
          cd "$WORKDIR"
          sudo tar czf "${GITHUB_WORKSPACE}/out-merged/vyos-rootfs-rock5b-merged.tar.gz" .
          cd "${GITHUB_WORKSPACE}"
          sudo rm -rf "$WORKDIR"

      - name: Build final flashable image
        run: |
          chmod +x repo/scripts/rock5b/build-vyos-rock5b-image.sh
          mkdir -p work
          ARMBIAN_XZ=$(find armbian -iname "*.img.xz" | head -1)
          sudo env TMPDIR="$(pwd)/work" ./repo/scripts/rock5b/build-vyos-rock5b-image.sh \
            "$ARMBIAN_XZ" \
            out-merged/vyos-rootfs-rock5b-merged.tar.gz \
            vyos-rock5b-fresh.img

      - name: Compress image
        run: |
          sudo xz -T0 -6 vyos-rock5b-fresh.img
          sudo chown $(id -u):$(id -g) vyos-rock5b-fresh.img.xz

      - name: Generate release checksum
        run: |
          sha256sum vyos-rock5b-fresh.img.xz > SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyos-rock5b-image
          path: |
            vyos-rock5b-fresh.img.xz
            SHA256SUMS
          retention-days: 30
